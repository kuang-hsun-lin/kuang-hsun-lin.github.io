<svg viewBox="0 0 420 100" width="420" height="100" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0A2540"/>
            <stop offset="100%" stop-color="#081C30"/>
        </linearGradient>
        <linearGradient id="logo-gold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FDE68A"/>
            <stop offset="100%" stop-color="#F59E0B"/>
        </linearGradient>
        <linearGradient id="text-brand-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0284C7"/>
            <stop offset="100%" stop-color="#38BDF8"/>
        </linearGradient>
    </defs>

    <!-- Icon Mark (100x100 box) -->
    <g transform="translate(6, 6)">
        <rect width="88" height="88" rx="20" fill="url(#logo-bg)" filter="drop-shadow(0 4px 12px rgba(10,37,64,0.18))"/>
        <path d="M 25 28 C 40 28, 53 23, 62 17" stroke="#38BDF8" stroke-width="6.5" stroke-linecap="round" fill="none"/>
        <path d="M 25 44 C 40 44, 49 42, 55 39" stroke="#0284C7" stroke-width="6.5" stroke-linecap="round" fill="none"/>
        <path d="M 25 60 C 42 60, 55 65, 63 71" stroke="#38BDF8" stroke-width="6.5" stroke-linecap="round" fill="none"/>
        <path d="M 25 21 L 25 67" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round"/>
        <circle cx="65" cy="18" r="6.5" fill="url(#logo-gold)"/>
        <circle cx="65" cy="18" r="11" stroke="#FDE68A" stroke-width="1.2" stroke-dasharray="2.5 2.5" fill="none" opacity="0.85"/>
    </g>

    <!-- Wordmark Lockup -->
    <g transform="translate(112, 0)">
        <!-- EWN LAB Main Acronym -->
        <text x="0" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="1.5" fill="#0A2540">
            EWN <tspan fill="url(#text-brand-grad)">LAB</tspan>
        </text>
        <!-- Full English Name -->
        <text x="1" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" letter-spacing="0.4" fill="#475569">
            Evolved Wireless Networking Laboratory
        </text>
        <!-- Affiliation -->
        <text x="1" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" letter-spacing="0.8" fill="#0284C7">
            NYCU &bull; INSTITUTE OF COMMUNICATIONS ENGINEERING
        </text>
    </g>
</svg>
