<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 68" width="100%" height="auto" role="img" aria-label="EWN Lab Icon">
    <!-- Clean Hexagon Base -->
    <polygon points="32,3 60,19 60,51 32,67 4,51 4,19" fill="#F8FAFC" stroke="#0A2540" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Network Topologies & Beam Vectors -->
    <line x1="32" y1="3" x2="32" y2="35" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="2 2"/>
    <line x1="4" y1="19" x2="32" y2="35" stroke="#BAE6FD" stroke-width="1.6"/>
    <line x1="60" y1="19" x2="32" y2="35" stroke="#0284C7" stroke-width="2.2"/>
    <line x1="32" y1="35" x2="32" y2="67" stroke="#0284C7" stroke-width="2.4"/>
    <line x1="4" y1="51" x2="32" y2="35" stroke="#0A2540" stroke-width="2.2"/>
    <!-- Central and Peripheral Transceiver Nodes -->
    <circle cx="32" cy="35" r="4.5" fill="#0284C7"/>
    <circle cx="32" cy="35" r="8" stroke="#38BDF8" stroke-width="1" stroke-dasharray="2 2" fill="none"/>
    <circle cx="60" cy="19" r="3" fill="#0A2540"/>
    <circle cx="4" cy="51" r="3" fill="#0A2540"/>
    <circle cx="32" cy="67" r="3" fill="#0284C7"/>
</svg>
